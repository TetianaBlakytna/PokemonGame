<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="main.css">
    <title>POKEMON GAME</title>
        <script src="scripts/pokemon.js" defer></script>
    <script src="scripts/script.js" defer></script>

    </head>
<body>
    <div class="container">
        <h1>Welcome to the Pokémon Game!</h1>

        <p>Select your Pokémon and start the adventure!</p>

         <h2>Choose your buddy!</h2>
         <div class="pokemon-selection">
    <button class="pokemon-card" id="pikachu">
        <img src="images/pikachu.jpeg" alt="Pikachu">
        <h2>Pikachu</h2>
        <p>HP: 100</p>
        <p>Attack: 20</p>
    </button>
        <button class="pokemon-card" id="charmander">
        <img src="images/Charmander.jpeg" alt="Charmander">
        <h2>Charmander</h2>
        <p>HP: 90</p>
        <p>Attack: 25</p>
    </button>
        <button class="pokemon-card" id="bulbasaur">
        <img src="images/Bulbasaur.jpeg" alt="Bulbasaur">
        <h2>Bulbasaur</h2>
        <p>HP: 120</p>
        <p>Attack: 15</p>
    </button>
</div>
         <h2>Battle place</h2>
    <div id="battle-screen" style="display: none;">
        <div id="player-pokemon">
            <h3>Your Pokémon</h3>
            <img id="player-pokemon-img" src="" alt="">
            <p id="player-pokemon-name"></p>
            <p id="player-pokemon-health"></p>
                        <p id="player-pokemon-attack-power"></p>
        </div>

        <div id="opponent-pokemon">
            <h3>Opponent Pokémon</h3>
            <img id="opponent-pokemon-img" src="" alt="">
            <p id="opponent-pokemon-name"></p>
            <p id="opponent-pokemon-health"></p>
                       <p id="opponent-pokemon-attack-power"></p>
        </div>

        <button id="attack-button">Attack!</button>


    </div>


         <p>kiyyaa</p>

    

    </div>
</body>
